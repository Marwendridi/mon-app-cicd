apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app
spec:
  replicas: 6
  selector:
    matchLabels:
      app: mon-app
  template:
    metadata:
      labels:
        app: mon-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: mon-app
      containers:
        - name: mon-app
          image: tsallami/mon-app:latest
          ports:
            - containerPort: 5000
